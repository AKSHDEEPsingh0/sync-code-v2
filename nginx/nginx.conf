events {
    worker_connections 1024;
}

http {
    # Define the upstream group for the Socket Engine Pods
    upstream socket_cluster {
        # 'socket-engine' is the service name in docker-compose.yml
        # Docker's internal DNS will automatically resolve this to both Pod A and Pod B
        server socket-engine:5000;
    }

    server {
        # Listen on the public HTTP port
        listen 80;
        server_name localhost;

        # 1. Route WebSockets and API traffic to the Socket Engine
        location /socket.io/ {
            proxy_pass http://socket_cluster;
            
            # CRITICAL: These headers allow Nginx to upgrade standard HTTP to WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Route standard web traffic to the React Frontend
        location / {
            proxy_pass http://sync-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}