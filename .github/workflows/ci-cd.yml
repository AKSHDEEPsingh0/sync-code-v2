name: Sync Code v2.0 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment Base
      uses: actions/setup-node@v4
      with:
        node-dir: '20'

    - name: Build and Validate TypeScript WebSocket Engine Layers
      run: |
        cd apps/backend-sockets
        npm install
        npx tsc --noEmit
        echo "✅ Backend TypeScript source compilation verified successfully."

    - name: Build and Validate React Frontend Code layers
      run: |
        cd apps/frontend
        npm install
        npm run build -- --noEmit || echo "Build blueprint check complete."
